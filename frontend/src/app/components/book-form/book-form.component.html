<div class="modal-backdrop" (click)="closeModal.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>📖 Add New Book</h3>
      <button class="close-btn" (click)="closeModal.emit()">&times;</button>
    </div>

    <div *ngIf="errorMessage" class="alert-error">
      ⚠️ {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="book-form">
      <div class="form-group">
        <label for="title">Title *</label>
        <input
          id="title"
          type="text"
          [(ngModel)]="title"
          name="title"
          placeholder="e.g. Clean Architecture"
          required
        />
      </div>

      <div class="form-group">
        <label for="author">Author *</label>
        <input
          id="author"
          type="text"
          [(ngModel)]="author"
          name="author"
          placeholder="e.g. Robert C. Martin"
          required
        />
      </div>

      <div class="form-group">
        <label for="publisher">Publisher *</label>
        <input
          id="publisher"
          type="text"
          [(ngModel)]="publisher"
          name="publisher"
          placeholder="e.g. Prentice Hall"
          required
        />
      </div>

      <div class="form-group">
        <label for="isbn">ISBN Number *</label>
        <input
          id="isbn"
          type="text"
          [(ngModel)]="isbn"
          name="isbn"
          placeholder="e.g. 978-0134494166"
          required
        />
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="closeModal.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Book</button>
      </div>
    </form>
  </div>
</div>
